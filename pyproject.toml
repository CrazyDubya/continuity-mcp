[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-mcp"
version = "0.1.0"
description = "Self-hosted, provenance-preserving personal AI memory server with scoped MCP access across conversation archives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
continuity = "continuity_mcp.cli:main"
continuity-mcp = "continuity_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
